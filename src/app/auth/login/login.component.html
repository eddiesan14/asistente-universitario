
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión</title>

    <style>
         
    </style>
</head>

<body>

    <div class="login-container">

        <h2>Bienvenido</h2>
        <p>Inicia sesión en tu cuenta</p>

        <form [formGroup]="formLogin" (ngSubmit)="iniciarSesion()" id="loginForm">

            <div class="input-group">
                <label for="usuario">Correo electrónico</label>
                <input
                    formControlName="email"
                    type="email"
                    id="usuario"
                    placeholder="Ingresa tu correo"
                    required
                >
            </div>

            <div class="input-group">
                <label for="password">Contraseña</label>
                <input
                    formControlName="password"
                    type="password"
                    id="password"
                    placeholder="Ingresa tu contraseña"
                    required
                >
            </div>

            <div class="forgot-password">
                <a href="#">¿Olvidaste tu contraseña?</a>
            </div>

            <button type="submit" class="login-button" >
                Iniciar sesión
            </button>

        </form>

        <div class="login-failed" *ngIf="!islogin">
            <p>Correo o contraseña incorrectos</p>
        </div>
        <div class="register">
            ¿No tienes cuenta?
            <a href="src/app/auth/register/register.component.html">Regístrate</a>
        </div>

    </div>

    <script>
        document.getElementById("loginForm").addEventListener("submit", function(event) {
            event.preventDefault();

            const usuario = document.getElementById("usuario").value;
            const password = document.getElementById("password").value;

            alert("Formulario enviado correctamente. Bienvenido: " + usuario);
        });
    </script>

</body>
</html>
